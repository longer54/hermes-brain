<style>

.ev{display:flex;gap:10px;background:linear-gradient(90deg,rgba(159,214,138,.08),transparent);border-left:2px solid var(--rad);border-radius:4px 12px 12px 4px;padding:7px 10px;margin:0 0 6px;font-size:12.5px}.ev .g{color:var(--rad);font-size:11px;min-width:76px}

  const pr=(z&&z.przyszle)||[];if(pr.length){P.appendChild(hd(t('hd_future'),pr.length));let last=null;
    pr.forEach(x=>{if(x.data!=last){last=x.data;const g=document.createElement('div');g.className='dz';g.textContent=dzien(x.data,d0);P.appendChild(g)}P.appendChild(wiersz(x,{kol:kolSt(x.status),menu:1,klik:()=>odh(x)}))})}
  const n=$('n-zad');n.hidden=!dz.length;n.textContent=dz.length}
async function loadPam(){const P=$('p-pam');let pm;try{pm=await api('/api/pamiec')}catch(e){P.innerHTML='<div class="pusto">'+t('mem_err')+'</div>';return}
  const poz=pm.pozycje||[];P.innerHTML='';P.appendChild(hd(t('hd_mem'),poz.length));
  if(!poz.length)P.insertAdjacentHTML('beforeend','<div class="pusto">'+t('mem_empty')+'</div>');
  poz.forEach(x=>P.appendChild(wiersz(x,{kol:'#ff6fb5',meta:x.waga||'',klik:()=>api('/api/zadania/odhacz',{plik:x.plik,nr:x.nr,linia:x.linia}).then(()=>setTimeout(loadPam,600))})));
  const n=$('n-pam');n.hidden=!poz.length;n.textContent=poz.length}
async function loadZak(){const L=$('zakl');let d;try{d=await api('/api/zakupy')}catch(e){L.innerHTML='<div class="pusto">'+t('shop_err')+'</div>';return}
  const p=d.pozycje||[],dk=p.filter(x=>!x.kupione),k=p.filter(x=>x.kupione);L.innerHTML='';
  const tg=x=>api('/api/zakupy/odhacz',{nr:x.nr,linia:x.linia}).then(()=>setTimeout(loadZak,400));
  L.appendChild(hd(t('hd_buy'),dk.length));if(!dk.length)L.insertAdjacentHTML('beforeend','<div class="pusto">'+t('shop_empty')+'</div>');
  dk.forEach(x=>L.appendChild(wiersz(x,{kol:'#ff9f1c',toggle:1,klik:()=>tg(x)})));
  if(k.length){L.appendChild(hd(t('hd_bought'),k.length));k.forEach(x=>L.appendChild(wiersz(x,{kol:'#9fd68a',done:1,toggle:1,klik:()=>tg(x)})))}
  const n=$('n-zak');n.hidden=!dk.length;n.textContent=dk.length}
$('zakf').onsubmit=async e=>{e.preventDefault();const v=$('zaki').value.trim();if(!v)return;try{const r=await api('/api/zakupy/dodaj',{tresc:v});if(r.byly&&r.byly.length)alert(t('already')+r.byly.join(', '));$('zaki').value='';loadZak()}catch(err){alert(t('add_fail')+err.message)}};
async function loadSpo(){const P=$('p-spo');let d;try{d=await api('/api/spotkania')}catch(e){P.innerHTML='<div class="pusto">'+t('meet_err')+'</div>';return}
  const s=(d.spotkania||[]);P.innerHTML='';P.appendChild(hd(t('hd_meet'),s.length));if(!s.length)P.insertAdjacentHTML('beforeend','<div class="pusto">'+t('meet_empty')+'</div>');
  s.forEach(sp=>{const c=document.createElement('div');c.className='spot';const zz=sp.zadania||[];const ot=zz.filter(z=>!z.zrobione).length;
    c.innerHTML=`<h4>${esc(sp.nazwa||sp.tytul||sp.plik)}</h4><div class="mt">${esc(sp.data||'')} · ${t('open_of',ot,zz.length)}</div>`;
    zz.forEach(z=>c.appendChild(wiersz(z,{kol:z.zrobione?'#9fd68a':'#d4af37',done:z.zrobione,toggle:1,klik:()=>api('/api/spotkania/odhacz',{plik:sp.plik,nr:z.nr,linia:z.linia}).then(()=>setTimeout(loadSpo,400))})));P.appendChild(c)})}
let kodIds=new Set(),kodT=0,otwarte=new Set();
function kodPing(){if(tab=='kod'){clearTimeout(kodT);kodT=setTimeout(loadKod,900)}}
const kindName=r=>{const m={zmiana:'change','nowy plik':'new file'};return t('kind_'+(m[r]||r))};
function kolor(k,r){const l=esc(k).split('\n');if(r=='change'||r=='zmiana'){let tr=0;return l.map(x=>{if(x=='--- było'||x=='--- old'){tr=-1;return'<span class="dh">--- '+t('diff_old')+'</span>'}if(x=='+++ jest'||x=='+++ new'){tr=1;return'<span class="dh">+++ '+t('diff_new')+'</span>'}return`<span class="${tr<0?'dm':tr>0?'dp':''}">${x||' '}</span>`}).join('')}
  return l.map(x=>`<span>${x||' '}</span>`).join('')}
async function loadKod(){let d;try{d=await api('/api/kod')}catch(e){$('kodl').innerHTML='<div class="pusto">'+t('code_err')+'</div>';return}
  const L=$('kodl');const first=!kodIds.size;L.querySelectorAll('details').forEach(x=>{if(x.open)otwarte.add(x.dataset.id);else otwarte.delete(x.dataset.id)});
  L.innerHTML=d.length?'':'<div class="pusto">'+t('code_empty')+'</div>';
  d.forEach((k,i)=>{const nw=!first&&!kodIds.has(k.id);const e=document.createElement('details');e.className='kod'+(nw?' nowy':'');e.dataset.id=k.id;
    if(otwarte.has(k.id)||(i==0&&(first||nw)))e.open=true;
    e.innerHTML=`<summary><span class="tg ${k.rodzaj=='terminal'?'terminal':(k.rodzaj=='change'||k.rodzaj=='zmiana')?'change':k.rodzaj=='python'?'python':''}">${esc(kindName(k.rodzaj))}</span><span class="pl" title="${esc(k.plik)}">${esc(k.plik)}</span><span class="cz" style="color:${agc(k.agent)}">${esc(k.agent)}</span><span class="cz">${new Date(k.t*1000).toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit'})}</span></summary><pre>${kolor(k.kod,k.rodzaj)}</pre>`;
    L.appendChild(e)});kodIds=new Set(d.map(k=>k.id))}
setInterval(()=>{if(tab=='kod')loadKod()},5000);
setInterval(()=>{if(tab=='zad')loadZad();else if(tab=='pam')loadPam();else if(tab=='zak')loadZak();else if(tab=='spo')loadSpo()},60000);
pollRadar();setInterval(pollRadar,8000);
upd();rs();requestAnimationFrame(tick);
setTab(tab);if(tab!='zak')loadZak();if(tab!='zad')loadZad();if(tab!='pam')loadPam();
</script></body></html>
